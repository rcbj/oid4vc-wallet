[package]
name = "oid4vc-wallet"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
description = "Linux native verifiable credential wallet for OpenID4VCI and OpenID4VP"
license = "Apache-2.0"
repository = "https://github.com/rcbj/oid4vc-wallet"
readme = "README.md"
publish = false
keywords = ["openid", "openid4vci", "openid4vp", "verifiable-credentials", "wallet"]
categories = ["command-line-utilities"]

# No dependencies. OpenID4VCI, OpenID4VP and SIOPv2 are implemented in this
# crate. Do not add a crate whose job is to implement those protocols.
# A future cryptographic primitive or HTTP stack needs its own review; it is
# not a substitute for the messages in src/protocol.

[lib]
name = "oid4vc_wallet"
path = "src/lib.rs"

[[bin]]
name = "oid4vc-wallet"
path = "src/main.rs"
