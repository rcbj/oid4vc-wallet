[package]
name = "oid4vc-wallet"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
description = "Linux native verifiable credential wallet for OpenID4VCI and OpenID4VP"
license = "BUSL-1.1"
repository = "https://github.com/rcbj/oid4vc-wallet"
readme = "README.md"
publish = false
keywords = ["openid", "openid4vci", "openid4vp", "verifiable-credentials", "wallet"]
categories = ["command-line-utilities", "gui"]

# OpenID4VCI, OpenID4VP and SIOPv2 are implemented in this crate. Do not add
# a crate whose job is to implement those protocols.
#
# aes-gcm seals credentials at rest. keyring talks to the Secret Service,
# which GNOME Keyring provides. KeePassXC provides that service when its
# integration is on. dbus talks to KWallet on KDE when the Secret Service is
# not running. crypto-rust encrypts the Secret Service key on the session
# bus. vendored builds the D-Bus client without a separate libdbus
# development package.
#
# eframe draws the --ui window. rfd opens the desktop file selector for
# import and export. image decodes the window icon. p256 signs the
# OpenID4VCI proof of possession. ctap-fido2 speaks CTAP2 over USB HID
# and returns the FIDO2 hmac-secret this wallet uses as a key-encryption
# key. That crate implements the FIDO messages only, so another vendor's
# authenticator works when it supports the same extension. yubikey talks
# to PIV slot 82 through PC/SC, the less common alternative to hmac-secret;
# p256 runs the ECDH and HKDF around that card's decipher. The `untested`
# feature is the crate's gate for PIV decipher; the call itself is the
# standard GENERAL AUTHENTICATE. rustls is the TLS stack. The signature
# crates (p256, p384, p521, k256, rsa, ed25519-dalek, ed448-goldilocks-plus,
# fips204, fips205) and x509-parser check credential signatures and
# certificate chains. None of these crates implements OpenID4VCI, OpenID4VP,
# SIOPv2, SD-JWT, or JOSE.

[dependencies]
aes-gcm = "0.10"
ctap-fido2 = "0.1.3"
dbus = { version = "0.9", features = ["vendored"] }
ed25519-dalek = "3.0.0"
ed448-goldilocks-plus = "0.18.1"
eframe = { version = "0.37", default-features = false, features = ["default_fonts", "system_fonts", "glow", "x11", "clipboard"] }
fips204 = "0.4.6"
fips205 = "0.4.1"
image = { version = "0.25", default-features = false, features = ["png"] }
k256 = "0.14.0"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8", "std"] }
p384 = "0.14.0"
p521 = "0.14.0"
rand_core = { version = "0.6", features = ["getrandom"] }
rsa = "0.9.10"
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
sha2 = { version = "0.10", features = ["oid"] }
sha3 = "0.10"
webpki-roots = "1"
x509-parser = "0.18.1"
yubikey = { version = "0.8", features = ["untested"] }
zeroize = "1"

[lib]
name = "oid4vc_wallet"
path = "src/lib.rs"

[[bin]]
name = "oid4vc-wallet"
path = "src/main.rs"

[dev-dependencies]
rcgen = "0.14.10"

# Pedantic is on so style drift fails ./install/test.sh and CI, which run
# clippy with -D warnings. The lower priority lets a single lint be set
# differently below the group if that is ever needed.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
